name: CI - Lint, Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check server and source files
        run: |
          for f in server.js scripts/*.js src/**/*.js src/*.js; do
            node --check "$f" || exit 1
          done

      - name: Syntax-check front-end files
        run: |
          for f in public/js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run automated test suite
        run: npm test

      - name: Validate prototype HTML (Task 1 deliverable)
        run: |
          for f in prototype/*.html; do
            npx --yes html-validate "$f"
          done

      - name: Validate Task 2 app shell HTML
        run: npx --yes html-validate public/index.html