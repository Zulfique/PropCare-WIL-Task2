name: CD - Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hook_url:
        description: 'Render deploy hook URL (https://api.render.com/deploy/srv-...?...). Leave blank to use the RENDER_DEPLOY_HOOK_URL secret.'
        required: false
        type: string
      checks_url:
        description: 'Live app base URL to verify after deploy, e.g. https://propcare-wil-task2.onrender.com'
        required: false
        type: string
        default: https://propcare-wil-task2.onrender.com

jobs:
  deploy:
    name: Deploy PropCare (Render)
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.render.outputs.deployed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Select Render deploy hook
        id: hook
        env:
          INPUT_HOOK_URL: ${{ inputs.hook_url }}
          SECRET_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$INPUT_HOOK_URL" ]; then
            echo "Using the manually supplied Render deploy hook."
            URL="$INPUT_HOOK_URL"
          elif [ -n "$SECRET_HOOK_URL" ]; then
            echo "Using the RENDER_DEPLOY_HOOK_URL repository secret."
            URL="$SECRET_HOOK_URL"
          else
            URL=""
          fi

          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy hook
        id: render
        if: steps.hook.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ steps.hook.outputs.url }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Confirmed deploy requested
        if: steps.render.outputs.deployed == 'true'
        run: |
          echo "Render deploy hook triggered successfully."
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"

      - name: Deploy skipped
        if: steps.hook.outputs.configured != 'true'
        run: |
          echo "::warning::Render deployment was not triggered."
          echo "::warning::Configure the RENDER_DEPLOY_HOOK_URL repository secret or provide hook_url when manually running this workflow."

  verify:
    name: Verify live deployment
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve check URL
        id: check
        run: |
          URL="${{ inputs.checks_url }}"
          if [ -z "$URL" ]; then URL="https://propcare-wil-task2.onrender.com"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Verifying live app at $URL/api/health"

      - name: Poll /api/health until ready
        env:
          BASE: ${{ steps.check.outputs.url }}
        run: |
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)
            if [ "$code" = "200" ] && grep -q '"success"' /tmp/health.json; then
              echo "::notice::Live deployment healthy at $BASE/api/health"
              exit 0
            fi
            echo "Waiting for deploy... (http $code)"
            sleep 20
          done
          echo "::error::Live app did not become healthy within 15 minutes: $BASE/api/health"
          exit 1
