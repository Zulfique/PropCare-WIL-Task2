name: CD - Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hook_url:
        description: 'Render deploy hook URL (https://api.render.com/deploy/srv-...?...). Leave blank to use the RENDER_DEPLOY_HOOK_URL secret.'
        required: false
      checks_url:
        description: 'Live app base URL to verify after deploy, e.g. https://propcare-wil-task2.onrender.com'
        required: false
        default: https://propcare-wil-task2.onrender.com

jobs:
  deploy:
    name: Deploy PropCare (Render)
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.hook.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy hook URL
        id: hook
        env:
          SECRET_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          INPUT_URL: ${{ inputs.hook_url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            echo "hook=$INPUT_URL" >> "$GITHUB_OUTPUT"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SECRET_URL" ]; then
            echo "hook=$SECRET_URL" >> "$GITHUB_OUTPUT"
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Render deploy hook configured (set RENDER_DEPLOY_HOOK_URL or pass hook_url input) - deploy skipped."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy hook
        id: render
        if: steps.hook.outputs.hook != ''
        env:
          HOOK_URL: ${{ steps.hook.outputs.hook }}
        run: curl -fsS -X POST "$HOOK_URL"

      - name: Confirmed deploy requested
        run: echo "Render deploy hook triggered for ${{ github.repository }}@${{ github.sha }}"

  verify:
    name: Verify live deployment
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve check URL
        id: check
        run: |
          URL="${{ inputs.checks_url }}"
          if [ -z "$URL" ]; then URL="https://propcare-wil-task2.onrender.com"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Verifying live app at $URL/api/health"

      - name: Poll /api/health until ready
        env:
          BASE: ${{ steps.check.outputs.url }}
        run: |
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)
            if [ "$code" = "200" ] && grep -q '"success"' /tmp/health.json; then
              echo "::notice::Live deployment healthy at $BASE/api/health"
              exit 0
            fi
            echo "Waiting for deploy... (http $code)"
            sleep 20
          done
          echo "::error::Live app did not become healthy within 15 minutes: $BASE/api/health"
          exit 1